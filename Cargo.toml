#:tombi schema.strict = false
[package]
name = "MemoryPractice"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false

[profile.dev."*"]
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[dependencies]
iced = { version = "0.14.0", features = ["thread-pool","tiny-skia", "wayland"], default-features = false }
